<script>
/* ============ Scripts.html ============ */

var APP = {
  user: null,
  weekId: null,
  availableWeeks: [],
  route: 'dashboard',
  lastFeedTimestamp: null,
  pollTimer: null,
  chartInstances: {}
};

var NAV_ITEMS = [
  { key:'dashboard', icon:'🏠', label:'Dashboard', roles:['ADMIN','SHIFT_MANAGER','TEAM_LEADER','AGENT','VIEWER'] },
  { key:'mycalls', icon:'📞', label:'השיחות שלי', roles:['AGENT'] },
  { key:'teamcalls', icon:'☎️', label:'שיחות הצוות', roles:['TEAM_LEADER'] },
  { key:'leaderboards', icon:'🏆', label:'דירוגים', roles:['ADMIN','SHIFT_MANAGER','TEAM_LEADER','AGENT','VIEWER'] },
  { key:'teams', icon:'👥', label:'צוותים', roles:['ADMIN','SHIFT_MANAGER','TEAM_LEADER','AGENT','VIEWER'] },
  { key:'agents', icon:'👑', label:'נציגים', roles:['ADMIN','SHIFT_MANAGER','TEAM_LEADER','AGENT','VIEWER'] },
  { key:'leaders', icon:'🧑\u200d💼', label:'ראשי צוותים', roles:['ADMIN','SHIFT_MANAGER','TEAM_LEADER','AGENT','VIEWER'] },
  { key:'tasks', icon:'✅', label:'משימות מנהל', roles:['ADMIN','SHIFT_MANAGER','TEAM_LEADER'] },
  { key:'badges', icon:'⭐', label:'Badges', roles:['ADMIN','SHIFT_MANAGER','TEAM_LEADER','AGENT','VIEWER'] },
  { key:'hof', icon:'🏛', label:'Hall of Fame', roles:['ADMIN','SHIFT_MANAGER','TEAM_LEADER','AGENT','VIEWER'] },
  { key:'analytics', icon:'📊', label:'Analytics', roles:['ADMIN','SHIFT_MANAGER','TEAM_LEADER'] },
  { key:'admin', icon:'⚙️', label:'ניהול', roles:['ADMIN','SHIFT_MANAGER'] }
];

/* ---------- Flask/Vercel API wrapper ---------- */
function callServer(fnName){
  var args = Array.prototype.slice.call(arguments, 1);
  return fetch('/api/call', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ function: fnName, args: args })
  }).then(function(res){ return res.json(); }).then(function(payload){
    if (!payload.success) throw new Error(payload.error || 'שגיאה לא צפויה');
    return payload.data;
  });
}

/* ---------- Toasts ---------- */
function toast(message, type){
  var root = document.getElementById('toast-root');
  var el = document.createElement('div');
  el.className = 'toast ' + (type||'');
  el.textContent = message;
  root.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3800);
}

/* ---------- Modal ---------- */
function openModal(html){
  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal-root').classList.add('open');
}
function closeModal(){ document.getElementById('modal-root').classList.remove('open'); }
document.getElementById('modal-backdrop').addEventListener('click', closeModal);

/* ---------- Count-up animation ---------- */
function animateCountUps(container){
  (container||document).querySelectorAll('.count-up').forEach(function(el){
    var target = Number(el.getAttribute('data-target')) || 0;
    var start = 0, duration = 700, startTime = null;
    function step(ts){
      if(!startTime) startTime = ts;
      var progress = Math.min(1, (ts-startTime)/duration);
      el.textContent = (start + (target-start)*progress).toFixed(1);
      if(progress < 1) requestAnimationFrame(step); else el.textContent = target;
    }
    requestAnimationFrame(step);
  });
}

/* ---------- Init ---------- */
window.addEventListener('DOMContentLoaded', function(){
  var savedToken = localStorage.getItem('rb_token');
  if(savedToken){
    APP.authToken = savedToken;
    callServer('getCurrentUser', savedToken).then(function(user){
      enterApp(user);
    }).catch(function(){
      // הטוקן פג תוקף/לא תקין - חזרה למסך כניסה
      localStorage.removeItem('rb_token');
      renderWizardStart();
    });
  } else {
    renderWizardStart();
  }
});

/* ================= Agent registration / login wizard ================= */
var WIZ = { mode:null, division:null, teamId:null, teamName:null };

function wizardShell(innerHtml, showBack, backFn){
  var back = showBack ? '<div class="wizard-back" onclick="'+backFn+'">→ חזרה</div>' : '';
  document.getElementById('login-wizard').innerHTML = back + innerHtml;
}

function renderWizardStart(){
  WIZ = { mode:null, division:null, teamId:null, teamName:null };
  wizardShell(
    '<button class="wizard-choice" onclick="wizardSelectMode(\'login\')">'
      + '<div class="wc-title">🔑 כניסה</div><div class="wc-sub">כבר נרשמתי למערכת</div></button>'
    + '<button class="wizard-choice" onclick="wizardSelectMode(\'signup\')">'
      + '<div class="wc-title">🆕 כניסה ראשונה — הרשמה כנציג</div><div class="wc-sub">זו הפעם הראשונה שלי במערכת</div></button>'
    + '<a class="legacy-link" href="#" onclick="renderLegacyLogin(); return false;">כניסת ניהול / ראש צוות ←</a>',
    false
  );
}

function wizardSelectMode(mode){
  WIZ.mode = mode;
  callServer('getDivisions').then(function(divisions){
    var html = '<div class="wizard-step-title">מאיזה מוקד את/ה?</div>'
      + divisions.map(function(d){
          return '<button class="wizard-choice" onclick="wizardSelectDivision('+aj(d)+')"><div class="wc-title">'+esc(d)+'</div></button>';
        }).join('');
    wizardShell(html, true, 'renderWizardStart()');
  });
}

function wizardSelectDivision(division){
  WIZ.division = division;
  callServer('getTeamsByDivision', division).then(function(teams){
    var label = WIZ.mode==='signup' ? 'לאיזה צוות את/ה שייך/ת?' : 'באיזו מחלקה את/ה?';
    var html = '<div class="wizard-step-title">'+label+'</div>'
      + (teams.length ? teams.map(function(t){
          return '<button class="wizard-choice" onclick="wizardSelectTeam('+aj(t.teamId)+', '+aj(t.name)+')"><div class="wc-title">'+esc(t.name)+'</div></button>';
        }).join('') : emptyState('👥','אין עדיין צוותים במוקד הזה'));
    wizardShell(html, true, 'wizardSelectMode(\''+WIZ.mode+'\')');
  });
}

function wizardSelectTeam(teamId, teamName){
  WIZ.teamId = teamId; WIZ.teamName = teamName;
  var fn = WIZ.mode==='signup' ? 'getUnclaimedAgentsForTeam' : 'getClaimedAgentsForTeam';
  callServer(fn, teamId).then(function(agents){
    var html = '<div class="wizard-step-title">מי את/ה, '+esc(teamName)+'?</div>';
    if(!agents.length){
      html += WIZ.mode==='signup'
        ? emptyState('✅','כל הנציגים בצוות הזה כבר רשומים. נסה/י דרך מסך "כניסה".')
        : emptyState('👤','עדיין אין נציגים רשומים בצוות הזה. נסה/י דרך "כניסה ראשונה".');
    } else {
      agents.forEach(function(a){
        var action = WIZ.mode==='signup' ? 'wizardRegister' : 'wizardPromptPin';
        html += '<button class="wizard-choice" onclick="'+action+'('+aj(a.agentId)+', '+aj(a.name)+')"><div class="wc-title">'+esc(a.name)+'</div></button>';
      });
    }
    wizardShell(html, true, 'wizardSelectDivision('+aj(WIZ.division)+')');
  });
}

/** כניסה ראשונה: נבחר שם → השרת מייצר PIN אקראי ומציג פעם אחת בלבד */
function wizardRegister(agentId, name){
  wizardShell('<div class="empty-state">טוען...</div>', true, 'wizardSelectTeam('+aj(WIZ.teamId)+', '+aj(WIZ.teamName)+')');
  callServer('registerAgent', agentId).then(function(res){
    var html = '<div class="pin-reveal">'
      + '<div class="wc-title" style="font-size:16px;">ברוך/ה הבא/ה, '+esc(name)+'!</div>'
      + '<div style="color:var(--text-secondary); font-size:13px; margin-top:6px;">זהו קוד ה-PIN האישי שלך — שמור/י אותו, הוא לא יוצג שוב:</div>'
      + '<div class="digits">'+res.pin+'</div>'
      + '<div class="warn">⚠️ תצטרך/י את הקוד הזה בכל כניסה הבאה למערכת</div>'
      + '<button class="btn primary" style="width:100%; margin-top:18px;" onclick="wizardFinishRegistration()">המשך למערכת</button>'
      + '</div>';
    document.getElementById('login-wizard').innerHTML = html;
    localStorage.setItem('rb_token', res.token);
    APP.authToken = res.token;
    APP._pendingUser = res.user;
  }).catch(function(err){
    wizardShell('<div class="alert danger">⚠️ '+esc(err.message)+'</div>', true, 'wizardSelectTeam('+aj(WIZ.teamId)+', '+aj(WIZ.teamName)+')');
  });
}
function wizardFinishRegistration(){ enterApp(APP._pendingUser); }

/** כניסה רגילה: נבחר שם רשום → מזינים PIN קיים */
function wizardPromptPin(agentId, name){
  var html = '<div class="wizard-step-title">כניסה כ-'+esc(name)+'</div>'
    + '<div class="field"><label>קוד PIN אישי</label><input type="password" inputmode="numeric" id="wiz-pin-input" maxlength="8" autofocus></div>'
    + '<div id="wiz-pin-error" style="color:var(--danger); font-size:12.5px; margin-bottom:10px;"></div>'
    + '<button class="btn primary" style="width:100%;" onclick="wizardSubmitLogin('+aj(agentId)+')">כניסה</button>';
  wizardShell(html, true, 'wizardSelectTeam('+aj(WIZ.teamId)+', '+aj(WIZ.teamName)+')');
  document.getElementById('wiz-pin-input').addEventListener('keydown', function(e){
    if(e.key==='Enter') wizardSubmitLogin(agentId);
  });
}
function wizardSubmitLogin(agentId){
  var pin = document.getElementById('wiz-pin-input').value;
  callServer('login', agentId, pin).then(function(res){
    localStorage.setItem('rb_token', res.token);
    APP.authToken = res.token;
    enterApp(res.user);
  }).catch(function(err){
    document.getElementById('wiz-pin-error').textContent = err.message || 'שגיאה בהתחברות';
  });
}

/* ================= Management login ================= */
var MANAGEMENT_USERS = [];
var SHIFT_MANAGER_ORDER = ['נהוראי', 'סברין', 'שקד', 'משי', 'טליה'];

function renderLegacyLogin(){
  callServer('getUsersForRoleSelection').then(function(users){
    MANAGEMENT_USERS = users;
    wizardShell(
      '<div class="wizard-step-title">כניסת ניהול / ראש צוות</div>'
        + '<button class="wizard-choice" onclick="renderShiftManagerLogin()"><div class="wc-title">אחמ"שים</div><div class="wc-sub">בחירת אחמ"ש להתחברות</div></button>'
        + '<button class="wizard-choice" onclick="renderTeamLeaderDivisionLogin()"><div class="wc-title">ראשי צוותים</div><div class="wc-sub">בחירת ראש צוות לפי מחלקה</div></button>',
      true,
      'renderWizardStart()'
    );
  });
}

function managementUserList(users, emptyMessage, backFn){
  var roleLabels = {ADMIN:'מנהל מערכת', SHIFT_MANAGER:'אחמ"ש', TEAM_LEADER:'ראש צוות'};
  var html = users.map(function(u){
    return '<div class="user-option" onclick="promptForPin('+aj(u.userId)+', '+aj(u.name)+')">'
      + '<span>'+esc(u.name)+'</span><span class="role-tag">'+(roleLabels[u.role]||u.role)+'</span></div>';
  }).join('');
  wizardShell(html || emptyState('👤', emptyMessage), true, backFn);
}

function renderShiftManagerLogin(){
  var managers = MANAGEMENT_USERS.filter(function(u){ return u.role==='SHIFT_MANAGER'; });
  managers.sort(function(a, b){
    return SHIFT_MANAGER_ORDER.indexOf(a.name) - SHIFT_MANAGER_ORDER.indexOf(b.name);
  });
  managementUserList(managers, 'אין אחמ"שים במערכת', 'renderLegacyLogin()');
}

function renderTeamLeaderDivisionLogin(){
  wizardShell(
    '<div class="wizard-step-title">בחר/י מחלקה</div>'
      + '<button class="wizard-choice" onclick="renderTeamLeaderLogin(\'שירות\')"><div class="wc-title">ראש צוות שירות</div></button>'
      + '<button class="wizard-choice" onclick="renderTeamLeaderLogin(\'שימור\')"><div class="wc-title">ראש צוות שימור</div></button>',
    true,
    'renderLegacyLogin()'
  );
}

function renderTeamLeaderLogin(division){
  callServer('getTeamsByDivision', division).then(function(teams){
    var teamIds = teams.map(function(team){ return team.teamId; });
    var leaders = MANAGEMENT_USERS.filter(function(u){
      return u.role==='TEAM_LEADER' && teamIds.indexOf(u.teamId)!==-1;
    });
    managementUserList(leaders, 'אין ראשי צוותים במחלקת '+division, 'renderTeamLeaderDivisionLogin()');
  });
}

/**
 * לחיצה על שם ברשימה לא מחברת מיד - היא רק בוחרת "מי אתה טוען שאתה".
 * ההתחברות בפועל דורשת קוד PIN, שהשרת מאמת מול Hash שמור - כך שאי אפשר
 * להיכנס בתור מישהו אחר רק כי יודעים את ה-userId שלו.
 */
function promptForPin(userId, name){
  var html = '<div class="modal-title">כניסה כ-'+esc(name)+'</div>'
    + '<div class="field"><label>קוד PIN אישי</label><input type="password" inputmode="numeric" id="pin-input" maxlength="8" autofocus></div>'
    + '<div id="pin-error" style="color:var(--danger); font-size:12.5px; margin-bottom:10px;"></div>'
    + '<button class="btn primary" style="width:100%;" onclick="submitLogin(\''+userId+'\')">כניסה</button>';
  openModal(html);
  document.getElementById('pin-input').addEventListener('keydown', function(e){
    if(e.key==='Enter') submitLogin(userId);
  });
}
function submitLogin(userId){
  var pin = document.getElementById('pin-input').value;
  callServer('login', userId, pin).then(function(res){
    closeModal();
    localStorage.setItem('rb_token', res.token);
    APP.authToken = res.token;
    enterApp(res.user);
  }).catch(function(err){
    document.getElementById('pin-error').textContent = err.message || 'שגיאה בהתחברות';
  });
}

function enterApp(user){
  APP.user = user;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-shell').style.display = 'flex';
  document.getElementById('user-name-chip').textContent = user.name;
  document.getElementById('user-avatar-chip').textContent = initials(user.name);
  document.querySelector('.user-chip').style.cursor = 'pointer';
  document.querySelector('.user-chip').onclick = openChangePinModal;
  buildSidebar();
  loadWeeks().then(function(){
    handleRoute();
    startPolling();
  });
}

function logout(){
  localStorage.removeItem('rb_token');
  location.reload();
}

function openChangePinModal(){
  var html = '<div class="modal-title">שינוי קוד PIN אישי</div>'
    + '<div class="field"><label>קוד נוכחי</label><input type="password" inputmode="numeric" id="old-pin"></div>'
    + '<div class="field"><label>קוד חדש (לפחות 4 ספרות)</label><input type="password" inputmode="numeric" id="new-pin"></div>'
    + '<div id="pin-change-error" style="color:var(--danger); font-size:12.5px; margin-bottom:10px;"></div>'
    + '<div style="display:flex; gap:10px;"><button class="btn primary" onclick="submitPinChange()">עדכן קוד</button><button class="btn" onclick="closeModal()">ביטול</button><button class="btn danger" style="margin-right:auto;" onclick="logout()">התנתקות</button></div>';
  openModal(html);
}
function submitPinChange(){
  var oldPin = document.getElementById('old-pin').value, newPin = document.getElementById('new-pin').value;
  callServer('changeOwnPin', APP.authToken, oldPin, newPin).then(function(){
    closeModal(); toast('קוד ה-PIN עודכן בהצלחה', 'success');
  }).catch(function(err){ document.getElementById('pin-change-error').textContent = err.message; });
}

/* ---------- Sidebar / nav ---------- */
function buildSidebar(){
  var html = '';
  var visibleItems = NAV_ITEMS.filter(function(n){ return n.roles.indexOf(APP.user.role) !== -1; });
  visibleItems.forEach(function(item){
    html += '<a class="nav-item" data-nav="'+item.key+'" href="#'+item.key+'">'
      + '<span class="ic">'+item.icon+'</span><span class="nav-label">'+item.label+'</span></a>';
  });
  document.getElementById('nav-list').innerHTML = html;
  buildMobileNav(visibleItems);
  document.getElementById('sidebar-toggle-btn').onclick = function(){
    document.getElementById('sidebar').classList.toggle('collapsed');
  };
  document.getElementById('hamburger').onclick = function(){
    document.getElementById('sidebar').classList.toggle('mobile-open');
    document.getElementById('sidebar-backdrop').classList.toggle('show');
  };
  document.getElementById('sidebar-backdrop').onclick = function(){
    document.getElementById('sidebar').classList.remove('mobile-open');
    document.getElementById('sidebar-backdrop').classList.remove('show');
  };
}

function buildMobileNav(visibleItems){
  var preferred = ['dashboard','mycalls','teamcalls','leaderboards','teams'];
  var items = preferred.map(function(key){
    return visibleItems.filter(function(item){ return item.key===key; })[0];
  }).filter(Boolean).slice(0, 5);
  var tabbar = document.getElementById('mobile-tabbar');
  tabbar.innerHTML = items.map(function(item){
    return '<a class="mobile-nav-item" data-mobile-nav="'+item.key+'" href="#'+item.key+'">'
      + '<span class="mobile-nav-icon">'+item.icon+'</span><span>'+item.label+'</span></a>';
  }).join('');
}

window.addEventListener('hashchange', handleRoute);

/* ---------- Week selector ---------- */
function loadWeeks(){
  return callServer('getAvailableWeeks').then(function(weeks){
    APP.availableWeeks = weeks;
    return callServer('getCurrentWeekId');
  }).then(function(current){
    APP.weekId = current;
    var sel = document.getElementById('week-select');
    sel.innerHTML = APP.availableWeeks.map(function(w){
      var label = (w===current) ? (w+' — השבוע הנוכחי') : w;
      return '<option value="'+w+'"'+(w===APP.weekId?' selected':'')+'>'+label+'</option>';
    }).join('');
    sel.onchange = function(){ APP.weekId = sel.value; APP.lastFeedTimestamp=null; renderCurrentRoute(); };
  });
}

/* ---------- Router ---------- */
function handleRoute(){
  var hash = location.hash.replace('#','') || 'dashboard';
  APP.route = hash;
  document.querySelectorAll('.nav-item').forEach(function(n){
    n.classList.toggle('active', hash.split('/')[0] === n.getAttribute('data-nav'));
  });
  document.querySelectorAll('.mobile-nav-item').forEach(function(n){
    n.classList.toggle('active', hash.split('/')[0] === n.getAttribute('data-mobile-nav'));
  });
  document.getElementById('sidebar').classList.remove('mobile-open');
  var backdrop = document.getElementById('sidebar-backdrop');
  if(backdrop) backdrop.classList.remove('show');
  renderCurrentRoute();
}

/* click delegation for data-route links inside rendered components */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-route]');
  if(el){ location.hash = el.getAttribute('data-route'); }
});

function setPageTitle(title, sub){
  document.getElementById('page-title').textContent = title;
  document.getElementById('page-sub').textContent = sub || '';
}

function renderCurrentRoute(){
  var root = document.getElementById('view-root');
  var parts = APP.route.split('/');
  var page = parts[0], param = parts[1];
  root.innerHTML = skeleton('100%','200px') + skeleton('100%','200px');

  var routes = {
    dashboard: renderDashboardPage,
    mycalls: renderMyCallsPage,
    teamcalls: renderTeamCallsPage,
    leaderboards: renderLeaderboardsPage,
    teams: function(){ param ? renderTeamDetailPage(param) : renderTeamsListPage(); },
    agents: function(){ param ? renderAgentDetailPage(param) : renderAgentsListPage(); },
    leaders: function(){ param ? renderLeaderDetailPage(param) : renderLeadersListPage(); },
    tasks: renderTasksPage,
    badges: renderBadgesPage,
    hof: renderHofPage,
    analytics: renderAnalyticsPage,
    admin: renderAdminPage
  };
  (routes[page] || renderDashboardPage)();
}

/* ================= DASHBOARD ================= */
function renderDashboardPage(){
  setPageTitle('RETENTION BATTLE', 'שבוע ' + APP.weekId);
  callServer('getDashboardData', APP.authToken, APP.weekId).then(function(d){
    APP.lastFeedTimestamp = (d.activityFeed[0] && d.activityFeed[0].timestamp) || null;
    var html = '';

    html += renderCountdown(d.weekMeta);

    // כרטיס "Leading Team" נפרד לכל מוקד - אין תחרות בין שימור לשירות
    var leadingTeamCards = d.kpis.leadingTeamsByDivision.map(function(entry){
      return renderKpiCard('🏆','Leading Team — '+entry.division, entry.team ? entry.team.name : '—', entry.team ? (entry.team.score+' נק׳') : '');
    }).join('');
    html += '<div class="grid grid-4">'
      + leadingTeamCards
      + renderKpiCard('👑','Top Agent', d.kpis.topAgent ? d.kpis.topAgent.name : '—', d.kpis.topAgent ? (d.kpis.topAgent.points+' נק׳') : '')
      + renderKpiCard('🧑\u200d💼','Leading Team Leader', d.kpis.leadingLeader ? d.kpis.leadingLeader.name : '—', d.kpis.leadingLeader ? ('Score '+d.kpis.leadingLeader.score) : '')
      + '</div>';

    html += renderTeamBattleByDivision(d.teamBattleByDivision, '⚔️ TEAM BATTLE');

    html += '<div class="section-title">👑 TOP AGENTS</div>';
    html += renderPodium(d.topAgents);
    html += '<div class="card">' + renderLeaderboardHeader() + d.agentLeaderboard.slice(0,10).map(renderAgentRow).join('') + '</div>';

    html += '<div class="section-title">🧑\u200d💼 TEAM LEADER BATTLE</div>';
    html += '<div class="grid grid-3">' + d.leaderBattle.map(renderLeaderCard).join('') + '</div>';

    html += '<div class="section-title">📡 LIVE FEED</div>';
    html += '<div class="card" id="live-feed-box">' + (d.activityFeed.length ? d.activityFeed.map(function(i){return renderFeedItem(i,false);}).join('') : emptyState('📡','אין עדיין אירועים השבוע')) + '</div>';

    document.getElementById('view-root').innerHTML = html;
    animateCountUps();
  }).catch(showLoadError);
}

function renderCountdown(weekMeta){
  var end = new Date(weekMeta.endDate);
  return '<div class="card" style="margin-bottom:18px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">'
    + '<div><div style="font-weight:800; font-size:15px;">WEEK '+weekMeta.weekId+'</div><div class="kpi-sub">הקרב על כל לקוח</div></div>'
    + '<div id="week-countdown" data-end="'+end.getTime()+'" style="font-weight:800; font-size:18px; color:var(--cyan);"></div>'
    + '</div>';
}
setInterval(function(){
  var el = document.getElementById('week-countdown');
  if(!el) return;
  var diff = Number(el.getAttribute('data-end')) - Date.now();
  if(diff < 0){ el.textContent = 'השבוע הסתיים'; return; }
  var d = Math.floor(diff/86400000), h = Math.floor(diff%86400000/3600000), m = Math.floor(diff%3600000/60000), s = Math.floor(diff%60000/1000);
  el.textContent = d+'ד '+h+'ש '+m+'ד '+s+'ש עד סוף השבוע';
}, 1000);

      + renderKpiCard('📞','בדיקות השבוע', o.totalReviewsThisWeek)
      + renderKpiCard('👥','נציגים פעילים', o.agentCount)
      + renderKpiCard('🏳️','צוותים', o.teamCount)

      + '<button class="btn" style="justify-content:center; padding:16px;" onclick="switchAdminTab(\'review\')">⚡ ניקוד מהיר</button>'

    // "מי הבא בתור" - הסבב המאוזן קובע, לא האחמ"ש. זה מחליף חיפוש ידני ברשימת עובדים.

    html += '<div class="grid grid-2">' + plan.map(function(t){

            var statusLabel = a.roundStatus==='IN_PROGRESS' ? ' (חסרה שיחה 2/2)' : (a.roundStatus==='DEFERRED' ? ' (נדחה קודם)' : '');

        + rows + '</div>';
    }).join('') + '</div>';

    // כיסוי שבועי לפי מוקד
    html += '<div class="section-title">📊 כיסוי שבועי לפי מוקד</div><div class="grid grid-2">'

    html += '<div class="section-title">🕒 בדיקות אחרונות</div><div class="card">'
      + (o.recentReviews.length ? o.recentReviews.map(function(r){

function openCloseWeekConfirm(weekId){
  var html = '<div class="modal-title">אישור סגירת שבוע '+esc(weekId)+'</div>'
    + '<div class="alert danger" style="margin-bottom:14px;">פעולה זו סופית ולא ניתנת לביטול. התוצאה תוקפא לצמיתות.</div>'
    + '<div class="field"><label>הקלד/י בדיוק: <b>סגור את שבוע '+esc(weekId)+'</b></label><input type="text" id="close-week-confirm-input" placeholder="סגור את שבוע '+esc(weekId)+'"></div>'
    + '<div id="close-week-error" style="color:var(--danger); font-size:12.5px; margin-bottom:10px;"></div>'
    + '<div style="display:flex; gap:10px;">'
    + '<button class="btn danger" id="close-week-confirm-btn" disabled onclick="doCloseWeek()">כן, סגור את השבוע לצמיתות</button>'
    + '<button class="btn" onclick="closeModal()">ביטול</button></div>';
  openModal(html);
  var expected = 'סגור את שבוע ' + weekId;

function doCloseWeek(){
  var btn = document.getElementById('close-week-confirm-btn');
  if(btn) btn.disabled = true;
  callServer('closeCurrentWeek', APP.authToken).then(function(res){
    closeModal();
    var winners = (res.snapshot && res.snapshot.winningTeamsByDivision) || [];
    var winnersText = winners.map(function(w){ return w.teamName+' ('+w.division+')'; }).join(' · ');
    toast('השבוע '+res.closedWeekId+' נסגר בהצלחה. זוכים: '+winnersText, 'success');
    loadWeeks().then(renderCurrentRoute);
  }).catch(function(e){
    var errEl = document.getElementById('close-week-error');
    if(errEl) errEl.textContent = e.message; else toast(e.message,'error');

  });
}

var REVIEW_CATEGORIES = [
  ['Tashaul','תשאול נכון'], ['HatamatHatzaa','הצעה מותאמת ללקוח'], ['EichutSherut','שירות איכותי']

/**
 * בונה את טופס ניקוד השיחה לתוך containerId. ctx.mode='dropdown' (בחירת נציג
 * חופשית + כפתור רנדומלי, לטאב "ניקוד שיחה מהיר") או ctx.mode='fixed'
 * (נציג כבר נבחר מראש דרך אשף "ניהול תחרות" - מוקד/צוות/נציג). שני המצבים
 * חולקים בדיוק את אותה לוגיקת שמירה, כדי שלא ייווצר פיצול בין שני מסכים.
 */
function renderCallScoreForm(containerId, ctx){
  Promise.all([callServer('getLeaveReasons'), callServer('getOffers')]).then(function(res){
    var reasons = res[0], offers = res[1];
    var agentFieldHtml;
    if(ctx.mode==='fixed'){
      agentFieldHtml = '<div class="field"><label>נציג</label><div class="badge-chip" style="font-size:14px; padding:9px 16px;">👤 '+esc(ctx.agentName)+'</div></div>';
    } else {
      window._reviewAgents = ctx.agents;
      agentFieldHtml = '<div class="field"><label>נציג</label><div style="display:flex; gap:8px;">'
        + '<select id="rf-agent" style="flex:1;">'+ctx.agents.map(function(a){return '<option value="'+a.agentId+'">'+esc(a.name)+'</option>';}).join('')+'</select>'
        + '<button type="button" class="btn sm" onclick="pickRandomAgent()">🎲 רנדומלי</button></div></div>';
    }

    var html = '<div class="card" style="max-width:640px;">'
      + '<div class="alert warning" style="margin-bottom:16px;">🎧 האזן/י לשיחה של הנציג, ודרג/י אותה לפי הקריטריונים למטה. הניקוד משוקלל אוטומטית לציון השיחה, לניקוד הנציג השבועי, ולניקוד הצוות.</div>'
      + agentFieldHtml
      + '<div class="field"><label>מספר לקוח</label><input type="text" id="rf-customer" placeholder="מספר טלפון / מזהה לקוח שאיתו התנהלה השיחה"></div>'
      + '<div class="grid grid-2"><div class="field"><label>תאריך</label><input type="date" id="rf-date" value="'+new Date().toISOString().slice(0,10)+'"></div>'
      + '<div class="field"><label>שעה</label><input type="text" id="rf-time" value="'+new Date().toTimeString().slice(0,5)+'"></div></div>';

    REVIEW_CATEGORIES.forEach(function(c){
      html += '<div class="field"><label>'+c[1]+'</label><div class="score-slider-row">'
        + '<input type="range" min="0" max="10" value="7" id="rf-'+c[0]+'" oninput="document.getElementById(\'val-'+c[0]+'\').textContent=this.value">'
        + '<span class="score-val" id="val-'+c[0]+'">7</span></div></div>';
    });

    html += '<div class="field"><label>שימור מוצלח?</label><div class="toggle-group" id="rf-success">'
      + '<button type="button" class="toggle-btn selected yes" data-val="כן" onclick="pickToggle(\'rf-success\',this)">כן</button>'
      + '<button type="button" class="toggle-btn" data-val="לא" onclick="pickToggle(\'rf-success\',this)">לא</button></div></div>';

    html += '<div class="section-title" style="margin-top:22px; margin-bottom:10px; font-size:13px; color:var(--text-secondary);">פרטים נוספים (אופציונלי)</div>';
    html += '<div class="field"><label>סיבת נטישה</label><select id="rf-reason">'+reasons.map(function(r){return '<option>'+esc(r)+'</option>';}).join('')+'</select></div>';
    html += '<div class="field"><label>הצעה שניתנה</label><select id="rf-offer">'+offers.map(function(o){return '<option>'+esc(o)+'</option>';}).join('')+'</select></div>';

    html += '<div class="field"><label>בונוס שיחה מצטיינת</label><div class="toggle-group" id="rf-bonus">'
      + '<button type="button" class="toggle-btn" data-val="כן" onclick="pickToggle(\'rf-bonus\',this)">כן</button>'
      + '<button type="button" class="toggle-btn selected no" data-val="לא" onclick="pickToggle(\'rf-bonus\',this)">לא</button></div></div>';

    html += '<div class="field"><label>הערת אחמ"ש (פנימי - לא מוצג לנציג)</label><textarea id="rf-note"></textarea></div>';
    html += '<button class="btn primary" onclick="submitCallScoreForm('+aj(containerId)+', '+aj(ctx.mode==='fixed'?ctx.agentId:null)+')">שמור שיחה מתועדת</button>';
    html += '</div>';
    document.getElementById(containerId).innerHTML = html;
  });
}
function pickRandomAgent(){
  var agents = window._reviewAgents || [];
  if(!agents.length) return;
  var pick = agents[Math.floor(Math.random()*agents.length)];
  document.getElementById('rf-agent').value = pick.agentId;
  toast('נבחר/ה באקראי: '+pick.name, 'success');
}
function pickToggle(groupId, btn){
  var group = document.getElementById(groupId);
  group.querySelectorAll('.toggle-btn').forEach(function(b){ b.classList.remove('selected','yes','no'); });
  btn.classList.add('selected', btn.getAttribute('data-val')==='כן' ? 'yes':'no');
}
function submitCallScoreForm(containerId, fixedAgentId){
  var data = buildScoreFormData(fixedAgentId);
  window._pendingScoreSubmit = { containerId: containerId, fixedAgentId: fixedAgentId, data: data };
  callServer('saveCallReview', APP.authToken, data).then(handleSaveCallReviewResult).catch(function(e){ toast(e.message || 'לא הצלחנו לשמור את הנתונים', 'error'); });
}
function buildScoreFormData(fixedAgentId){
  var data = {
    agentId: fixedAgentId || document.getElementById('rf-agent').value,
    customerNumber: document.getElementById('rf-customer').value,
    date: document.getElementById('rf-date').value,
    time: document.getElementById('rf-time').value
  };
  REVIEW_CATEGORIES.forEach(function(c){ data[c[0]] = document.getElementById('rf-'+c[0]).value; });
  data.retentionSuccess = document.querySelector('#rf-success .selected').getAttribute('data-val');
  data.leaveReason = document.getElementById('rf-reason').value;
  data.offerGiven = document.getElementById('rf-offer').value;
  data.excellentCallBonus = document.querySelector('#rf-bonus .selected').getAttribute('data-val') === 'כן';
  data.reviewerNote = document.getElementById('rf-note').value;
  return data;
}
/** תוצאת שמירה: או שנשמר בהצלחה, או שהשרת מחזיר חשד לכפילות שדורש החלטה מפורשת */
function handleSaveCallReviewResult(res){
  if(res && res.duplicateWarning){
    openDuplicateWarningModal(res.existing);
    return;
  }
  if(res && res.alreadyCompletedWarning){
    openAlreadyCompletedModal(res.message);
    return;
  }
  var roundMsg = '';
  if(res.reviewPurpose==='COMPETITION' && res.callsCompletedInRound){
    roundMsg = res.roundStatus==='COMPLETE' ? ' — ✓ סבב התחרות השבועי הושלם!' : ' — 1/2 שיחות בסבב, נותרה עוד שיחה אחת';
  }
  toast('השיחה נשמרה — ציון איכות: '+res.qualityScore+roundMsg, 'success');
  var pending = window._pendingScoreSubmit || {};
  if(pending.fixedAgentId){ renderCompetitionAgentDetail(pending.fixedAgentId); }
  else { renderCallReviewForm(); }
}
function openAlreadyCompletedModal(message){
  var pending = window._pendingScoreSubmit || {};
  var html = '<div class="modal-title">✓ סבב התחרות כבר הושלם</div>'
    + '<div class="alert success" style="margin-bottom:14px; white-space:pre-line;">'+esc(message)+'</div>'
    + '<div style="display:flex; gap:10px;">'
    + '<button class="btn" onclick="closeModal()">חזור</button>'
    + '<button class="btn primary" onclick="resubmitAsQA()">שמור כ-QA / Coaching</button>'
    + '</div>';
  openModal(html);
}
function resubmitAsQA(){
  var pending = window._pendingScoreSubmit;
  if(!pending) { closeModal(); return; }
  pending.data.reviewPurpose = 'QA';
  callServer('saveCallReview', APP.authToken, pending.data).then(function(res){
    closeModal();
    toast('נשמר כ-QA — לא משפיע על ניקוד התחרות', 'success');
    if(pending.fixedAgentId){ renderCompetitionAgentDetail(pending.fixedAgentId); }
    else { renderCallReviewForm(); }
  }).catch(function(e){ toast(e.message,'error'); });
}
function openDuplicateWarningModal(existing){
  var html = '<div class="modal-title">⚠️ יש כבר בדיקה דומה השבוע</div>'
    + '<div class="alert warning" style="margin-bottom:14px;">נמצאה בדיקה קיימת לאותו נציג ואותו מספר לקוח, באותו שבוע. ייתכן שזו הזנה כפולה של אותה שיחה — ודא/י שזו באמת שיחה אחרת לפני שממשיכים.</div>'
    + '<div class="card" style="margin-bottom:16px;">'
    + '<div class="stat-row"><span>תאריך ושעה</span><b>'+esc(existing.date)+' · '+esc(existing.time)+'</b></div>'
    + '<div class="stat-row"><span>נבדק/ה ע"י</span><b>'+esc(existing.reviewerName)+'</b></div>'
    + '<div class="stat-row"><span>מספר לקוח</span><b>'+esc(existing.customerNumber)+'</b></div>'
    + '<div class="stat-row"><span>ציון איכות</span><b>'+existing.qualityScore+'</b></div>'
    + '</div>'
    + '<div style="display:flex; gap:10px;">'
    + '<button class="btn" onclick="closeModal()">חזור לבדיקה</button>'
    + '<button class="btn danger" onclick="confirmDuplicateSave()">שמור בכל זאת — זו שיחה אחרת</button>'
    + '</div>';
  openModal(html);
}
function confirmDuplicateSave(){
  var pending = window._pendingScoreSubmit;
  if(!pending) { closeModal(); return; }
  pending.data.confirmDuplicate = true;
  callServer('saveCallReview', APP.authToken, pending.data).then(function(res){
    closeModal();
    handleSaveCallReviewResult(res);
  }).catch(function(e){ toast(e.message || 'לא הצלחנו לשמור את הנתונים', 'error'); });
}

function renderDocumentedCallCard(call, options){
  var catRows = Object.keys(call.categories).map(function(k){

    + '<div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px;">'
    + '<div><div style="font-weight:800;">'+call.date+' · '+call.time+'</div><div class="kpi-sub">נבדק/ה ע"י: '+esc(call.reviewerName)+' · לקוח: '+esc(call.customerNumber||'—')+'</div></div>'
    + '<div class="score-big" style="font-size:22px;">'+call.qualityScore+'</div>'
    + '</div>'
    + '<div style="margin-top:10px;">'+catRows+'</div>'
    + '<div class="stat-row"><span>שימור מוצלח</span><b>'+(call.retentionSuccess==='כן'?'✅ כן':'❌ לא')+'</b></div>'
    + (call.excellentCallBonus==='כן' ? '<div class="pill done" style="margin-top:8px;">⭐ בונוס שיחה מצטיינת</div>' : '')
    + (call.appealStatus ? '<div class="pill progress" style="margin-top:8px;">⚖️ ערעור: '+esc(appealStatusLabel(call.appealStatus))+'</div>' : '')
    + (options && options.canAppeal && !call.appealStatus ? '<button class="btn sm" style="margin-top:10px;" onclick="openReviewAppealModal('+aj(call.reviewId)+', '+aj(options.agentName)+')">⚖️ ערעור</button>' : '')
    + (call.reviewerNote ? '<div class="field" style="margin-top:12px;"><label>הערת אחמ"ש</label><div style="font-size:13px; color:var(--text-secondary);">'+esc(call.reviewerNote)+'</div></div>' : '')
    + '</div>';
}

/* ---- Users / PIN management tab ---- */
function renderAdminUsers(){
  var roleLabels = {ADMIN:'מנהל מערכת', SHIFT_MANAGER:'אחמ"ש', TEAM_LEADER:'ראש צוות', AGENT:'נציג', VIEWER:'צפייה'};
  callServer('getAllUsersForAdmin', APP.authToken).then(function(users){
    var html = '<div class="card">'
      + '<div class="alert warning">⚠️ קוד PIN הוא הדבר היחיד שמונע מנציג להיכנס בתור אחמ"ש/ראש צוות. יש לוודא שכל משתמש מחליף את קוד ברירת המחדל (1234) בכניסה הראשונה, ולאפס קוד מייד אם יש חשד שנחשף.</div>'
      + users.map(function(u){
          return '<div class="feed-item"><span><b>'+esc(u.name)+'</b> — '+(roleLabels[u.role]||u.role)+(u.claimed?'':' · <span style="color:var(--warning);">טרם נרשם</span>')+'</span>'
            + '<button class="btn sm" onclick="openResetPinModal(\''+u.userId+'\', '+aj(u.name)+')">איפוס PIN</button></div>';
        }).join('')
      + '</div>';
    document.getElementById('admin-content').innerHTML = html;
  });
}
function openResetPinModal(userId, name){
  var html = '<div class="modal-title">איפוס קוד PIN — '+esc(name)+'</div>'
    + '<div class="field"><label>קוד PIN חדש (לפחות 4 ספרות)</label><input type="text" inputmode="numeric" id="reset-pin-input"></div>'
    + '<div id="reset-pin-error" style="color:var(--danger); font-size:12.5px; margin-bottom:10px;"></div>'
    + '<button class="btn primary" style="width:100%;" onclick="submitResetPin(\''+userId+'\')">עדכן קוד</button>';
  openModal(html);
}
function submitResetPin(userId){
  var newPin = document.getElementById('reset-pin-input').value;
  callServer('setUserPin', APP.authToken, userId, newPin).then(function(){
    closeModal(); toast('קוד ה-PIN אופס בהצלחה', 'success');
  }).catch(function(err){ document.getElementById('reset-pin-error').textContent = err.message; });
}

/* ---- Config tab ---- */
function renderAdminConfig(){
  callServer('getAdminConfig', APP.authToken).then(function(cfg){
    var html = '<div class="card" style="max-width:640px;">';
    Object.keys(cfg).forEach(function(k){
      html += '<div class="field"><label>'+k+'</label><input type="text" id="cfg-'+k+'" value="'+esc(cfg[k])+'"></div>';
    });
    html += '<button class="btn primary" onclick="saveConfig()">שמור הגדרות</button></div>';
    document.getElementById('admin-content').innerHTML = html;
  });
}
function saveConfig(){
  callServer('getAdminConfig', APP.authToken).then(function(cfg){
    var updates = {};
    Object.keys(cfg).forEach(function(k){
      var el = document.getElementById('cfg-'+k);
      if(el) updates[k] = isNaN(el.value) ? el.value : Number(el.value);
    });
    callServer('updateConfigValues', APP.authToken, updates).then(function(){
      toast('ההגדרות עודכנו בהצלחה', 'success');
    }).catch(function(e){ toast(e.message,'error'); });
  });
}

/* ---- Audit log tab ---- */
var SCORE_AFFECTING_ACTIONS = ['הזנת בדיקת שיחה','עריכת בדיקת שיחה','ביטול בדיקת שיחה','אישור שמירה למרות התראת כפילות','מתן בונוס','עדכון הגדרות מערכת','סגירת שבוע'];
function renderAuditLog(){
  APP._auditFilters = APP._auditFilters || { entityType:'', userName:'', search:'' };
  callServer('getAuditLogFilterOptions', APP.authToken).then(function(opts){
    var html = '<div class="card" style="margin-bottom:14px;"><div class="grid grid-3">'
      + '<div class="field" style="margin-bottom:0;"><label>סוג ישות</label><select id="audit-f-entity"><option value="">הכל</option>'+opts.entityTypes.map(function(t){return '<option value="'+esc(t)+'">'+esc(t)+'</option>';}).join('')+'</select></div>'
      + '<div class="field" style="margin-bottom:0;"><label>משתמש</label><select id="audit-f-user"><option value="">הכל</option>'+opts.userNames.map(function(u){return '<option value="'+esc(u)+'">'+esc(u)+'</option>';}).join('')+'</select></div>'
      + '<div class="field" style="margin-bottom:0;"><label>חיפוש חופשי</label><input type="text" id="audit-f-search" placeholder="פעולה / מזהה..."></div>'
      + '</div><button class="btn primary sm" style="margin-top:12px;" onclick="applyAuditFilters()">סנן</button></div>'
      + '<div id="audit-log-list">'+skeleton('100%','200px')+'</div>';
    document.getElementById('admin-content').innerHTML = html;
    loadAuditLogList();
  });
}
function applyAuditFilters(){
  APP._auditFilters = {
    entityType: document.getElementById('audit-f-entity').value,
    userName: document.getElementById('audit-f-user').value,
    search: document.getElementById('audit-f-search').value
  };
  loadAuditLogList();
}
function loadAuditLogList(){
  callServer('getAuditLog', APP.authToken, APP._auditFilters, 100).then(function(logs){
    var html = '<div class="card">' + (logs.length ? logs.map(function(l){
      var isScoreAffecting = SCORE_AFFECTING_ACTIONS.indexOf(l.Action) !== -1;
      var badge = isScoreAffecting ? '<span class="pill failed" style="margin-right:6px;">משפיע על ניקוד</span>' : '';
      var details = (l.OldValue || l.NewValue) ? ('<div style="margin-top:4px; font-size:11.5px; color:var(--text-secondary); word-break:break-all;">'
        + (l.OldValue ? ('לפני: '+esc(String(l.OldValue).slice(0,200))+' ') : '') + (l.NewValue ? ('אחרי: '+esc(String(l.NewValue).slice(0,200))) : '') + '</div>') : '';
      return '<div class="feed-item" style="display:block;"><div style="display:flex; justify-content:space-between; align-items:center;">'
        + '<span class="feed-time">'+new Date(l.Timestamp).toLocaleString('he-IL')+'</span>'
        + '<span>'+badge+'<b>'+esc(l.UserName)+'</b> — '+esc(l.Action)+' ('+esc(l.EntityType)+')</span></div>'+details+'</div>';
    }).join('') : emptyState('📜','אין רישומים תואמים')) + (logs.length>=100?'<div class="kpi-sub" style="padding:10px;">מוצגות 100 התוצאות האחרונות - צמצם/י עם Filters לתוצאות ממוקדות יותר</div>':'') + '</div>';
    document.getElementById('audit-log-list').innerHTML = html;
  });
}

/* ================= Charts ================= */
function drawLineChart(canvasId, labels, series){
  var ctx = document.getElementById(canvasId); if(!ctx) return;
  if(APP.chartInstances[canvasId]) APP.chartInstances[canvasId].destroy();
  APP.chartInstances[canvasId] = new Chart(ctx, {
    type:'line',
    data:{ labels:labels, datasets: series.map(function(s){ return { label:s.label, data:s.data, borderColor:s.color, backgroundColor:s.color+'33', tension:.35, fill:true }; }) },
    options: chartBaseOptions()
  });
}
function drawBarChart(canvasId, labels, data){
  var ctx = document.getElementById(canvasId); if(!ctx) return;
  if(APP.chartInstances[canvasId]) APP.chartInstances[canvasId].destroy();
  APP.chartInstances[canvasId] = new Chart(ctx, {
    type:'bar',
    data:{ labels:labels, datasets:[{ data:data, backgroundColor:'#0EA5C4', borderRadius:6 }] },
    options: Object.assign(chartBaseOptions(), { plugins:{legend:{display:false}} })
  });
}
function chartBaseOptions(){
  return { responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{ labels:{ color:'#94A3B8' } } },
    scales:{ x:{ ticks:{ color:'#94A3B8' }, grid:{ color:'rgba(148,163,184,.08)' } },
             y:{ ticks:{ color:'#94A3B8' }, grid:{ color:'rgba(148,163,184,.08)' } } } };
}

/* ================= Polling (Live Feed) ================= */
function startPolling(){
  if(APP.pollTimer) clearInterval(APP.pollTimer);
  APP.pollTimer = setInterval(function(){
    if(APP.route !== 'dashboard') return;
    callServer('getActivityFeed', APP.weekId, APP.lastFeedTimestamp, 10).then(function(events){
      if(!events.length) return;
      APP.lastFeedTimestamp = events[0].timestamp;
      var box = document.getElementById('live-feed-box');
      if(box){
        var frag = events.map(function(e){ return renderFeedItem(e, true); }).join('');
        box.innerHTML = frag + box.innerHTML;
      }
    });
  }, 18000);
}

function showLoadError(err){
  document.getElementById('view-root').innerHTML = emptyState('⚠️', err.message || 'לא הצלחנו לטעון את הנתונים');
}

/* ================= Global search ================= */
var searchDebounce = null;
document.addEventListener('DOMContentLoaded', function(){
  var input = document.getElementById('global-search');
  if(!input) return;
  input.addEventListener('input', function(){
    clearTimeout(searchDebounce);
    var q = input.value.trim();
    if(q.length < 2){ closeSearchResults(); return; }
    searchDebounce = setTimeout(function(){ runGlobalSearch(q); }, 250);
  });
  document.addEventListener('click', function(e){
    if(!e.target.closest('.search-box')) closeSearchResults();
  });
});
function runGlobalSearch(q){
  Promise.all([callServer('getLeaderboard','AGENT',APP.weekId), callServer('getLeaderboard','TEAM',APP.weekId)])
    .then(function(res){
      var agents = res[0].filter(function(a){ return a.name.indexOf(q) !== -1; }).slice(0,5);
      var teams = res[1].filter(function(t){ return t.name.indexOf(q) !== -1; }).slice(0,5);
      showSearchResults(agents, teams);
    });
}
function showSearchResults(agents, teams){
  var box = document.getElementById('search-results');
  if(!box){
    box = document.createElement('div');
    box.id = 'search-results';
    box.style.cssText = 'position:absolute; top:44px; right:0; width:260px; background:var(--card); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); z-index:120; overflow:hidden;';
    document.querySelector('.search-box').style.position = 'relative';
    document.querySelector('.search-box').appendChild(box);
  }
  var rows = [];
  agents.forEach(function(a){ rows.push('<div class="feed-item" style="cursor:pointer; padding:9px 12px;" data-route="agent/'+a.agentId+'">👑 '+esc(a.name)+'</div>'); });
  teams.forEach(function(t){ rows.push('<div class="feed-item" style="cursor:pointer; padding:9px 12px;" data-route="team/'+t.teamId+'">👥 '+esc(t.name)+'</div>'); });
  box.innerHTML = rows.length ? rows.join('') : '<div style="padding:12px; color:var(--text-secondary); font-size:12.5px;">אין תוצאות</div>';
  box.style.display = 'block';
  box.querySelectorAll('[data-route]').forEach(function(el){
    el.addEventListener('click', function(){ closeSearchResults(); document.getElementById('global-search').value=''; });
  });
}
function closeSearchResults(){
  var box = document.getElementById('search-results');
  if(box) box.style.display = 'none';
}
</script>
