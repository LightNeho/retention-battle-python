<script>
/* ============ Components.html ============
   פונקציות עזר שמייצרות מחרוזות HTML לרכיבים חוזרים. אין כאן State - רק Render. */

function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
});}

/** ערך בטוח להטמעה בתוך attribute HTML מצוטט בגרשיים כפולים (onclick="...") שגם
 * מכיל קריאת JS עם ארגומנט מחרוזת - JSON.stringify לבדו לא מספיק כי הוא מייצר
 * גרשיים כפולים שסוגרים את ה-attribute מוקדם מדי. aj() עושה JSON.stringify
 * ואז הופך את הגרשיים הכפולים ל-&quot; כדי שהדפדפן יפענח אותם בחזרה ל-" רק
 * כשהוא קורא את תוכן ה-attribute כקוד JS, לא כשהוא מפרש את ה-HTML עצמו. */
function aj(v){ return JSON.stringify(v).replace(/"/g, '&quot;'); }

function initials(name){
  if(!name) return '?';
  var parts = name.trim().split(' ');
  return (parts[0][0] || '') + (parts[1] ? parts[1][0] : '');
}

function medalFor(rank){ return rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':('#'+rank); }

function trendChip(change){
  if(!change) return '<span class="trend flat">— ללא שינוי</span>';
  if(change>0) return '<span class="trend up">▲ '+change+'</span>';
  return '<span class="trend down">▼ '+Math.abs(change)+'</span>';
}

function pillForStatus(status){
  var map = {'הושלם':'done','בתהליך':'progress','לא התחיל':'todo','נכשל':'failed'};
  return '<span class="pill '+(map[status]||'todo')+'">'+esc(status)+'</span>';
}

function skeleton(w,h){ return '<div class="skeleton" style="width:'+(w||'100%')+';height:'+(h||'16px')+';margin-bottom:8px;"></div>'; }

function emptyState(icon, text){
  return '<div class="empty-state"><div class="ic">'+icon+'</div><div>'+esc(text)+'</div></div>';
}

/* ---------- Team battle grouped by division (teams only ever compete within their own division) ---------- */
function renderTeamBattleByDivision(groups, sectionTitlePrefix){
  if(!groups || !groups.length) return emptyState('👥','אין עדיין צוותים');
  return groups.map(function(group){
    var gridClass = group.teams.length >= 3 ? 'grid-3' : 'grid-2';
    var title = (sectionTitlePrefix || '⚔️ TEAM BATTLE') + ' — ' + esc(group.division);
    return '<div class="section-title">'+title+'<span class="tag">'+group.teams.length+' צוותים</span></div>'
      + '<div class="grid '+gridClass+'">' + group.teams.map(renderTeamCard).join('') + '</div>';
  }).join('');
}

/* ---------- KPI card ---------- */
function renderKpiCard(icon, label, value, sub){
  return '<div class="card kpi-card hoverable">'
    + '<div class="kpi-icon">'+icon+'</div>'
    + '<div class="kpi-label">'+esc(label)+'</div>'
    + '<div class="kpi-value">'+esc(value)+'</div>'
    + (sub ? '<div class="kpi-sub">'+esc(sub)+'</div>' : '')
    + '</div>';
}

/* ---------- Team battle card ---------- */
function renderTeamCard(team){
  var rankClass = team.rank===1 ? ' rank-1' : '';
  var medal = medalFor(team.rank);
  return '<div class="card team-card hoverable'+rankClass+'" data-route="team/'+team.teamId+'">'
    + '<div class="rank-badge">'+medal+'</div>'
    + '<div style="text-align:left;">'+trendChip(team.rankChange)+'</div>'
    + '<div class="team-name">'+esc(team.name)+'</div>'
    + '<div class="leader-name">👑 '+esc(team.leaderName||'')+'</div>'
    + '<div class="score-big count-up" data-target="'+team.score+'">0</div>'
    + '<div class="stat-row"><span>שימור</span><b>'+team.successRate+'%</b></div>'
    + '<div class="stat-row"><span>בדיקות</span><b>'+team.callsReviewed+'</b></div>'
    + '<div class="stat-row"><span>איכות ממוצעת</span><b>'+team.avgQuality+'</b></div>'
    + '<div class="progress-track"><div class="progress-fill" style="width:'+team.targetProgress+'%"></div></div>'
    + '<div class="stat-row"><span>יעד שבועי</span><b>'+team.targetProgress+'%</b></div>'
    + '</div>';
}

/* ---------- Podium (Top 3 agents) ---------- */
function renderPodium(top3){
  if(!top3.length) return emptyState('🏆','אין עדיין נתונים לשבוע זה');
  var order = ['p2','p1','p3']; // ויזואלית: שני, ראשון, שלישי
  var html = '<div class="podium-wrap">';
  top3.forEach(function(agent){
    var posClass = agent.rank===1?'p1':(agent.rank===2?'p2':'p3');
    html += '<div class="podium-card '+posClass+' hoverable" data-route="agent/'+agent.agentId+'">'
      + '<div class="podium-medal">'+medalFor(agent.rank)+'</div>'
      + '<div class="podium-avatar">'+initials(agent.name)+'</div>'
      + '<div class="podium-name">'+esc(agent.name)+'</div>'
      + '<div class="podium-team">'+esc(agent.teamName||'')+'</div>'
      + '<div class="podium-score">'+agent.points+'</div>'
      + '</div>';
  });
  html += '</div>';
  return html;
}

/* ---------- Agent leaderboard rows ---------- */
function renderLeaderboardHeader(){
  return '<div class="lb-row header">'
    + '<span>#</span><span>שם</span><span>ניקוד</span><span>הצלחה</span><span>איכות</span><span>שינוי</span></div>';
}
function renderAgentRow(a){
  return '<div class="lb-row hoverable" data-route="agent/'+a.agentId+'" style="cursor:pointer;">'
    + '<span class="lb-rank">'+medalFor(a.rank)+'</span>'
    + '<span class="lb-name"><span class="lb-team-dot"></span>'+esc(a.name)+'</span>'
    + '<span><b>'+a.points+'</b></span>'
    + '<span>'+a.successRate+'%</span>'
    + '<span>'+a.avgQuality+'</span>'
    + '<span>'+trendChip(a.rankChange)+'</span>'
    + '</div>';
}

/* ---------- Team leader battle card ---------- */
function renderLeaderCard(leader){
  return '<div class="card hoverable'+(leader.rank===1?' rank-1':'')+'" data-route="leader/'+leader.leaderId+'">'
    + '<div style="display:flex; justify-content:space-between; align-items:center;">'
    + '<span style="font-size:20px;">'+medalFor(leader.rank)+'</span>'+trendChip(leader.rankChange)
    + '</div>'
    + '<div class="team-name">'+esc(leader.name)+'</div>'
    + '<div class="leader-name">Score ניהולי</div>'
    + '<div class="score-big">'+leader.score+'</div>'
    + '<div class="stat-row"><span>משימות</span><b>'+leader.tasksCompleted+'/'+leader.tasksTotal+'</b></div>'
    + '<div class="progress-track"><div class="progress-fill" style="width:'+leader.taskCompletionRate+'%"></div></div>'
    + '<div class="stat-row"><span>ביצועי הצוות</span><b>'+leader.teamScore+'</b></div>'
    + '</div>';
}

/* ---------- Live feed ---------- */
function renderFeedItem(item, isNew){
  var t = new Date(item.timestamp);
  var timeStr = ('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2);
  return '<div class="feed-item'+(isNew?' new':'')+'"><span class="feed-time">'+timeStr+'</span><span>'+esc(item.message)+'</span></div>';
}

/* ---------- Badge tile ---------- */
function renderBadgeTile(badge){
  return '<div class="badge-tile">'
    + '<div class="ic">'+(badge.icon||'⭐')+'</div>'
    + '<div class="n">'+esc(badge.name)+'</div>'
    + '<div class="d">'+esc(badge.description||'')+'</div>'
    + '</div>';
}

/* ---------- Manager task card ---------- */
function renderTaskCard(task, canApprove){
  var approveBtn = (canApprove && task.status!=='הושלם' && task.type==='MANUAL')
    ? '<button class="btn primary sm" onclick="approveTask(\''+task.resultId+'\')">אשר השלמה</button>' : '';
  return '<div class="card">'
    + '<div style="display:flex; justify-content:space-between; align-items:flex-start;">'
    + '<div><div style="font-weight:800; font-size:14px;">'+esc(task.taskName)+'</div>'
    + '<div style="color:var(--text-secondary); font-size:12px; margin-top:3px;">'+esc(task.description||'')+'</div></div>'
    + pillForStatus(task.status)
    + '</div>'
    + '<div class="progress-track"><div class="progress-fill" style="width:'+task.progress+'%"></div></div>'
    + '<div class="stat-row"><span>נקודות</span><b>'+task.points+' / '+task.maxPoints+'</b></div>'
    + (approveBtn ? '<div style="margin-top:10px;">'+approveBtn+'</div>' : '')
    + '</div>';
}

/* ---------- Alerts ---------- */
function renderAlert(alert){
  var icon = alert.level==='danger'?'⚠️':alert.level==='success'?'🔥':'⚠️';
  return '<div class="alert '+alert.level+'">'+icon+' '+esc(alert.message)+'</div>';
}
</script>
